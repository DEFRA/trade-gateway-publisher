name: Publish Hot Fix

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
        with:
          fetch-depth: 0 # Depth 0 required for branch-based versioning
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v5
        with:
          dotnet-version: |
            10.0
      - name: Publish Hot Fix
        uses: DEFRA/cdp-build-action/build-hotfix@3761ef22decf8615b8fd275cd9b7142f8d356a11
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
