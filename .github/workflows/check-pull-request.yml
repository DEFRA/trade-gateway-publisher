name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # NuGet.config expands this at restore time
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            10.0   
      - name: Run unit tests
        run: |
          dotnet test --filter "Category!=IntegrationTest"
      - name: Run integration tests
        run: scripts/run-integration-tests.sh
      - name: Docker Compose Logs
        if: always()
        run: |
          docker compose logs
      - name: Check Dockerfile Builds
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trade-gateway-publisher:latest
          build-args: |
            DEFRA_NUGET_PAT=${{ secrets.GITHUB_TOKEN }}
      - name: Check with Trivy
        run: |
          docker run -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --ignore-unfixed \
            --exit-code 1 \
            trade-gateway-publisher:latest
  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: read
    uses: ./.github/workflows/sonarcloud.yml
    needs: pr-validator
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
