services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4566/_localstack/health || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - ./compose/floci/ready.d:/etc/floci/init/ready.d:ro
    networks:
      - cdp-tenant

  floci-ui:
    build:
      context: https://github.com/floci-io/floci-ui.git
    container_name: floci-ui
    ports:
      - "3000:3000"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - floci
    networks:
      - cdp-tenant

  aws-init:
    image: amazon/aws-cli
    depends_on:
      floci:
        condition: service_healthy
    volumes:
      - ./compose/floci/ready.d/init-aws.sh:/init-aws.sh:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2
    entrypoint: ["/bin/sh", "/init-aws.sh"]
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data
    restart: always

  trade-gateway-publisher:
    build:
      args:
        DEFRA_NUGET_PAT: ${DEFRA_NUGET_PAT}
      dockerfile: Dockerfile
    ports:
      - '8085:8085'
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      Mongo__DatabaseUri: mongodb://mongodb:27017/
    networks:
      - cdp-tenant

  wiremock:
    image: "holomekc/wiremock-gui:latest"
    container_name: my_wiremock
    ports:
      # This is just an example of a port mapping
      - "8088:8089"
      - "8084:8088"
    command:
      "--port 8089 --https-port 8088 --max-request-journal 1000 --local-response-templating"
    volumes:
      - ./root-dir:/home/wiremock
    environment:
      WIREMOCK_MY_VAR: "systemValue response templating feature"

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
