#      - ./compose/config/trade-gateway-publisher.env

  servicebus-emulator:
    image: servicebus-emulator-with-curl:latest
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/aspnet:8.0.3-cbl-mariner2.0-amd64 AS base
        FROM mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        COPY --from=base /usr/bin/curl /usr/bin/curl
        COPY --from=base /usr/lib /usr/lib
        COPY --from=base /bin/sh /bin/sh
    env_file:
      - ./compose/config/servicebus-emulator.env
      - ./compose/config/mssql.env
    volumes:
      - "./compose/config/asb.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5300/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "5672:5672"
      - "5300:5300"

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    env_file:
      - ./compose/config/mssql.env
    healthcheck:
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  wiremock:
    image: "holomekc/wiremock-gui:latest"
    ports:
      # This is just an example of a port mapping
      - "8088:8089"
      - "8084:8088"
    command:
      "--port 8089 --https-port 8088 --max-request-journal 1000 --local-response-templating"
    volumes:
      - ./root-dir:/home/wiremock:ro
    environment:
      WIREMOCK_MY_VAR: "systemValue response templating feature"

  trade-tracesnt-stub:
    image: defradigital/trade-tracesnt-stub:${TRADE_TRACESNT_STUB:-latest}
    env_file:
      - ./compose/config/trade-tracesnt-stub.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3000:8080"

  trade-gateway:
    image: defradigital/trade-gateway:${TRADE_GATEWAY:-latest}
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/trade-gateway.env
    depends_on:
      servicebus-emulator:
        condition: service_healthy
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-tracesnt-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8080:8080"
      
################################################################################

volumes:
  mongodb-data:
