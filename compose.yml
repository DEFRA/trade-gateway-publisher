services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: floci/floci:1.5.25-compat
    ports:
      - '4566:4566'
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/floci.env
    volumes:
      - ./compose/floci/ready.d:/etc/floci/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mongodb:
    image: mongo:7.0.28
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3
    restart: always

  trade-gateway-publisher:
    build:
      args:
        DEFRA_NUGET_PAT: ${DEFRA_NUGET_PAT}
      dockerfile: Dockerfile
    ports:
      - '8085:8085'
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/trade-gateway-publisher.env      

  asb-backend:
    env_file:
      - ./compose/config/asb-backend.env
    depends_on:
      sqledge:
        condition: service_healthy
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    ports:
      - "5672:5672"
      - "5300:5300"
    pull_policy: always
    volumes:
      - ./compose/config/asb.json:/ServiceBus_Emulator/ConfigFiles/Config.json

  asb:
    image: alpine/curl:latest
    depends_on:
      asb-backend:
        condition: service_started
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://asb-backend:5300/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  sqledge:
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 5s
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'
      timeout: 5s
    image: mcr.microsoft.com/azure-sql-edge:latest
    #    On some platforms there are compatibility issues with running Azure SQL Edge e.g. M1 Macs with later Docker versions.
    #    If SQL Edge does not work for you, try swapping out with SQL Server image instead
    #    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - ./compose/config/sqledge.env    
      
  wiremock:
    image: "holomekc/wiremock-gui:latest"
    ports:
      # This is just an example of a port mapping
      - "8088:8089"
      - "8084:8088"
    command:
      "--port 8089 --https-port 8088 --max-request-journal 1000 --local-response-templating"
    volumes:
      - ./root-dir:/home/wiremock:ro
    environment:
      WIREMOCK_MY_VAR: "systemValue response templating feature"

  trade-tracesnt-stub:
    image: defradigital/trade-tracesnt-stub:${TRADE_TRACESNT_STUB:-latest}
    env_file:
      - ./compose/config/trade-tracesnt-stub.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3000:8080"

  trade-gateway:
    image: defradigital/trade-gateway:${TRADE_GATEWAY:-latest}
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/trade-gateway.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-tracesnt-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3001:8080"
      
################################################################################

volumes:
  mongodb-data:
